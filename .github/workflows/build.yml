name: Build KytyPS5 (Linux)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, wolverine, '**' ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  KYTY_BUILD_ORIGIN: "Source"
  KYTY_BUILD_REPOSITORY: ${{ github.repository }}

jobs:
  metadata:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.value }}

    steps:
      - name: Generate release tag
        id: release_tag
        shell: bash
        run: |
          echo "value=KytyPS5-Linux-$(date -u +'%Y-%m-%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  linux:
    name: Build KytyPS5 (Linux x86_64)
    needs: metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            glslang-tools \
            libvulkan-dev \
            vulkan-tools \
            libgl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libdbus-1-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            libwayland-dev \
            wayland-protocols \
            libdecor-0-dev \
            qt6-base-dev \
            qt6-base-private-dev
          
          # Ensure glslangValidator symlink exists if only glslang was provided
          if command -v glslang >/dev/null 2>&1 && ! command -v glslangValidator >/dev/null 2>&1; then
            sudo ln -sf "$(which glslang)" /usr/local/bin/glslangValidator
          fi

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true

      - name: Verify toolchain
        shell: bash
        run: |
          git --version
          cmake --version
          ninja --version
          clang++ --version
          ld.lld --version
          if command -v glslangValidator >/dev/null 2>&1; then
            glslangValidator --version || true
          elif command -v glslang >/dev/null 2>&1; then
            glslang --version || true
          fi
          echo "Host architecture: $(uname -m)"

      - name: Configure CMake
        shell: bash
        run: |
          set -o pipefail
          mkdir -p _Build/linux
          cmake -S . -B _Build/linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DKYTY_BUILD_ORIGIN="Source" \
            -DKYTY_BUILD_REPOSITORY="${{ github.repository }}" \
            -DKYTY_RELEASE_TAG="${{ needs.metadata.outputs.release_tag }}" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache 2>&1 | tee _Build/configure.log

      - name: Check SDL3 backends configuration
        shell: bash
        run: |
          echo "SDL3 backends configuration summary:"
          grep -iE "(ALSA|PULSEAUDIO|WAYLAND|X11|LIBUDEV|DBUS)" _Build/configure.log || true

      - name: Build KytyPS5 targets (launcher & kyty_emulator)
        shell: bash
        run: |
          cmake --build _Build/linux \
            --target launcher kyty_emulator \
            --parallel $(nproc) || \
          cmake --build _Build/linux \
            --target launcher kyty_emulator \
            --verbose

      - name: Run Unit Tests
        shell: bash
        continue-on-error: true
        run: |
          cmake --build _Build/linux \
            --target page_manager_tests memory_tracker_tests \
              audio_out2_port_tests pad_haptics_tests controller_settings_tests ime_dialog_tests lru_cache_tests virtual_memory_allocation_tests \
              resource_tracking_tests scalar_provenance_tests \
              resource_materialization_tests shader_vertex_metadata_tests archive_file_tests avplayer_file_tests \
            --parallel $(nproc) || true
          ctest --test-dir _Build/linux --output-on-failure -E kernel_file_system || true

      - name: Install
        shell: bash
        run: |
          cmake --install _Build/linux --prefix _Build/linux/install

      - name: Verify artifacts
        shell: bash
        run: |
          test -f "_Build/linux/install/kyty_emulator" || { echo "kyty_emulator binary missing!"; exit 1; }
          test -f "_Build/linux/install/launcher" || { echo "launcher binary missing!"; exit 1; }
          file _Build/linux/install/launcher
          file _Build/linux/install/kyty_emulator
          file _Build/linux/install/kyty_emulator | grep -q "ELF 64-bit LSB .*x86-64"
          ldd _Build/linux/install/kyty_emulator || true
          _Build/linux/install/kyty_emulator --help || true

      - name: Package Linux build
        shell: bash
        run: |
          cd _Build/linux/install
          tar -czvf "$GITHUB_WORKSPACE/${{ needs.metadata.outputs.release_tag }}-Linux-x86_64.tar.gz" .
          echo "Packaged Linux release archive:"
          ls -lh "$GITHUB_WORKSPACE/${{ needs.metadata.outputs.release_tag }}-Linux-x86_64.tar.gz"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Linux-x86_64
          path: _Build/linux/install/**
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.metadata.outputs.release_tag }}
        run: |
          archive="$RELEASE_NAME-Linux-x86_64.tar.gz"
          if [ -f "$archive" ]; then
            if gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$RELEASE_NAME" "$archive" --clobber --repo "$GITHUB_REPOSITORY" || true
            else
              gh release create "$RELEASE_NAME" "$archive" \
                --generate-notes \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "$RELEASE_NAME" || true
            fi
          fi
